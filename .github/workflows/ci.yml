name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache-dependency-path: examples/go-runtime/go.mod

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check content contracts
        run: pnpm content:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm types:check

      - name: Production build
        run: pnpm build

      - name: Vet Go labs
        run: pnpm labs:vet

      - name: Test Go labs
        run: pnpm labs:test

      - name: Race test Go labs
        run: pnpm labs:race
